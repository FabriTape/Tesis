<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Estructura y Flujo - Proyecto ANALISIS</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/flowchart/1.17.1/flowchart.min.js"></script>

        <style>
            :root {
                --bg-color: #f8f9fa;
                --sidebar-bg: #2c3e50;
                --sidebar-hover: #34495e;
                --text-main: #333;
                --text-light: #ecf0f1;
                --accent: #3498db;
                --border: #dee2e6;
                --card-bg: #ffffff;
            }
            body {
                margin: 0;
                font-family: "Segoe UI", system-ui, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                display: flex;
                height: 100vh;
                overflow: hidden;
            }
            .sidebar {
                width: 280px;
                background-color: var(--sidebar-bg);
                color: var(--text-light);
                display: flex;
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar h2 {
                padding: 20px;
                margin: 0;
                font-size: 1.2rem;
                background-color: #1a252f;
                border-bottom: 1px solid #1a252f;
                text-align: center;
            }
            .module-list {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .module-item {
                padding: 15px 20px;
                cursor: pointer;
                border-bottom: 1px solid #34495e;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .module-item:hover,
            .module-item.active {
                background-color: var(--sidebar-hover);
                border-left: 4px solid var(--accent);
            }
            .badge {
                font-size: 0.7rem;
                padding: 3px 8px;
                border-radius: 12px;
                background: #e74c3c;
                color: white;
                font-weight: bold;
            }
            .badge.local {
                background: var(--accent);
            }

            .main-content {
                flex: 1;
                padding: 30px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }
            .header-title {
                margin-top: 0;
                font-size: 2.2rem;
                border-bottom: 2px solid var(--accent);
                padding-bottom: 10px;
                margin-bottom: 10px;
            }
            .desc {
                font-size: 1.1rem;
                color: #555;
                margin-bottom: 20px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                margin-bottom: 20px;
            }
            .card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 20px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            }
            .card h3 {
                margin-top: 0;
                color: var(--sidebar-bg);
                border-bottom: 1px solid var(--border);
                padding-bottom: 10px;
                font-size: 1.1rem;
            }
            ul.detail-list {
                padding-left: 20px;
                margin: 0;
                color: #444;
            }
            ul.detail-list li {
                margin-bottom: 8px;
                line-height: 1.4;
            }
            code {
                background: #f1f3f5;
                padding: 2px 6px;
                border-radius: 4px;
                font-family: monospace;
                color: #d63031;
            }

            .chip {
                display: inline-block;
                background: #e9ecef;
                padding: 5px 12px;
                border-radius: 16px;
                margin: 4px;
                font-size: 0.9rem;
                cursor: pointer;
                transition: background 0.2s;
            }
            .chip:hover {
                background: #ced4da;
            }
            .chip.external {
                background: #ffeaa7;
                color: #d35400;
            }

            /* Panel de Flowchart */
            .flowchart-panel {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 20px;
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            .flowchart-controls {
                display: flex;
                gap: 10px;
                margin-bottom: 15px;
            }
            .flowchart-controls textarea {
                flex: 1;
                height: 60px;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 4px;
                font-family: monospace;
                resize: vertical;
            }
            .flowchart-controls button {
                padding: 10px 20px;
                background: var(--accent);
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }
            .flowchart-controls button:hover {
                background: #2980b9;
            }
            #canvas {
                text-align: center;
                overflow: auto;
                flex: 1;
                background: #fafafa;
                border: 1px dashed #ccc;
                padding: 20px;
                border-radius: 8px;
            }
            .empty-state {
                text-align: center;
                color: #999;
                margin-top: 100px;
                font-size: 1.2rem;
            }
        </style>
    </head>
    <body>
        <div class="sidebar">
            <h2>📁 Proyecto ANALISIS</h2>
            <ul class="module-list" id="moduleList"></ul>
        </div>

        <div class="main-content" id="mainContent">
            <div class="empty-state">
                👈 Seleccioná un módulo del panel izquierdo para empezar.
            </div>
        </div>

        <script>
            // DSL extraído de tu prueba con pyflowchart
            const mainFlowchartDSL = `op2=>operation: import matplotlib.pyplot as plt
op4=>operation: from matplotlib.backends.backend_pdf import PdfPages
op6=>operation: from pandas import read_csv
op8=>operation: from ANALISIS.confidence_intervals import run_confidence_intervals
op10=>operation: from ANALISIS.constants import CSV_PATH, FF_VALUES, SALIDA_DIR
op12=>operation: from ANALISIS.erosion_viz import plot_erosion_boxplot, plot_erosion_heatmap, plot_erosion_vs_energia
op14=>operation: from ANALISIS.kinematics_calc import get_grid_pairs
st17=>start: start save_figure
io19=>inputoutput: input: fig, path
cond23=>condition: if fig and fig.get_axes()
sub27=>subroutine: plt.savefig(path, bbox_inches='tight')
sub29=>subroutine: plt.close(fig)
e34=>end: end save_figure
st38=>start: start run_analysis
io40=>inputoutput: input:
sub43=>subroutine: print('Cargando datos...')
op45=>operation: df = read_csv(CSV_PATH)
op47=>operation: grid_pairs = get_grid_pairs(df)
sub49=>subroutine: print(f'Datos: {len(df)} filas. Grid: {len(grid_pairs)} pares\\n')
sub51=>subroutine: SALIDA_DIR.mkdir(parents=True, exist_ok=True)
op53=>operation: figuras, datos_filtrados = run_confidence_intervals(df)
op55=>operation: valores_vel0 = sorted(df['vel0'].unique())
cond58=>condition: for ff in FF_VALUES
op62=>operation: dir_ff = SALIDA_DIR / f'ff_{ff}'
sub64=>subroutine: dir_ff.mkdir(parents=True, exist_ok=True)
cond67=>condition: if (fig_box := plot_erosion_boxplot(df, ff))
sub71=>subroutine: figuras.append(fig_box)
sub73=>subroutine: save_figure(fig_box, dir_ff / 'ids_boxplot.png')
cond79=>condition: for vel0 in valores_vel0
cond84=>condition: if (fig_heat := plot_erosion_heatmap(df, ff, vel0))
sub88=>subroutine: figuras.append(fig_heat)
sub90=>subroutine: save_figure(fig_heat, dir_ff / f'heatmap_erosion_{vel0}.png')
cond98=>condition: for metodo in ['Crudos', 'MAD']
op102=>operation: df_ff = datos_filtrados[datos_filtrados['ff'] == ff]
cond105=>operation: figuras.append(fig_ero) if  (fig_ero := plot_erosion_vs_energia(df_ff, ff, vel0, metodo))
op119=>operation: with PdfPages(SALIDA_DIR / 'resultado_final.pdf') as pdf:\\n    for fig in figuras:\\n        if fig and fig.get_axes():\\n            pdf.savefig(fig)
sub121=>subroutine: print(f'¡Listo! Figuras en {SALIDA_DIR}')
e123=>end: end run_analysis
cond127=>operation: run_analysis() if  __name__ == '__main__'

op2->op4\nop4->op6\nop6->op8\nop8->op10\nop10->op12\nop12->op14\nop14->st17\nst17->io19\nio19->cond23\ncond23(yes)->sub27\nsub27->sub29\nsub29->e34\ne34->st38\nst38->io40\nio40->sub43\nsub43->op45\nop45->op47\nop47->sub49\nsub49->sub51\nsub51->op53\nop53->op55\nop55->cond58\ncond58(yes)->op62\nop62->sub64\nsub64->cond67\ncond67(yes)->sub71\nsub71->sub73\nsub73->cond79\ncond79(yes)->cond84\ncond84(yes)->sub88\nsub88->sub90\nsub90->cond79\ncond84(no)->cond79\ncond79(no)->cond98\ncond98(yes)->op102\nop102->cond105\ncond105->cond98\ncond98(no)->cond58\ncond67(no)->cond79\ncond58(no)->op119\nop119->sub121\nsub121->e123\ne123->cond127\ncond23(no)->e34`;

            const data = {
                main: {
                    type: "local",
                    desc: "Orquestador principal del análisis.",
                    functions: ["run_analysis()", "save_figure(fig, path)"],
                    importsLocal: [
                        "confidence_intervals",
                        "constants",
                        "erosion_viz",
                        "kinematics_calc",
                    ],
                    importsExt: ["pandas", "matplotlib"],
                    dsl: mainFlowchartDSL,
                },
                confidence_intervals: {
                    type: "local",
                    desc: "Módulo estadístico para cálculo de ICs con MAD.",
                    functions: [
                        "run_confidence_intervals(df_raw)",
                        "calc_ic(data)",
                        "_style(ax, table, title)",
                    ],
                    importsLocal: ["cluster_calc", "constants"],
                    importsExt: [
                        "numpy",
                        "pandas",
                        "matplotlib",
                        "seaborn",
                        "scipy",
                    ],
                    dsl: "",
                },
                erosion_viz: {
                    type: "local",
                    desc: "Generador de visualizaciones de erosión.",
                    functions: [
                        "plot_erosion_boxplot",
                        "plot_erosion_heatmap",
                        "plot_erosion_vs_energia",
                    ],
                    importsLocal: [
                        "cluster_calc",
                        "constants",
                        "kinematics_calc",
                    ],
                    importsExt: [
                        "matplotlib",
                        "numpy",
                        "pandas",
                        "seaborn",
                        "scipy",
                    ],
                    dsl: "",
                },
            };

            const listContainer = document.getElementById("moduleList");
            const contentContainer = document.getElementById("mainContent");
            let currentChart = null;

            // Renderizar Menú
            Object.keys(data).forEach((modName) => {
                const li = document.createElement("li");
                li.className = "module-item";
                li.innerHTML = `<span>📄 ${modName}.py</span><span class="badge local">Local</span>`;
                li.onclick = () => renderModule(modName, li);
                listContainer.appendChild(li);
            });

            function renderModule(modName, element) {
                document
                    .querySelectorAll(".module-item")
                    .forEach((el) => el.classList.remove("active"));
                if (element) element.classList.add("active");

                const mod = data[modName];

                contentContainer.innerHTML = `
                <h1 class="header-title">📄 ${modName}.py</h1>
                <div class="desc">${mod.desc}</div>

                <div class="grid">
                    <div class="card">
                        <h3>🛠️ Exporta (Funciones)</h3>
                        <ul class="detail-list">${mod.functions.map((f) => "<li><code>" + f + "</code></li>").join("")}</ul>
                    </div>
                    <div class="card">
                        <h3>📥 Importa</h3>
                        <div>${mod.importsLocal.map((i) => '<span class="chip">👉 ' + i + ".py</span>").join("")}</div>
                        <h4 style="margin: 15px 0 5px; color:#666; font-size:0.9rem;">Externas:</h4>
                        <div>${mod.importsExt.map((i) => '<span class="chip external">📦 ' + i + "</span>").join("")}</div>
                    </div>
                </div>

                <div class="flowchart-panel">
                    <h3 style="margin-top:0; color:var(--sidebar-bg); border-bottom:1px solid var(--border); padding-bottom:10px;">🧩 Diagrama de Flujo (pyflowchart)</h3>
                    <div class="flowchart-controls">
                        <textarea id="dslInput" placeholder="Pegá acá el código generado por pyflowchart...">${mod.dsl}</textarea>
                        <button onclick="drawFlowchart()">Renderizar Flujo</button>
                    </div>
                    <div id="canvas"></div>
                </div>
            `;

                // Dibujar automático si hay DSL precargado
                if (mod.dsl.trim() !== "") {
                    drawFlowchart();
                }
            }

            window.drawFlowchart = function () {
                const code = document.getElementById("dslInput").value;
                const canvas = document.getElementById("canvas");
                canvas.innerHTML = ""; // Limpiar anterior

                if (currentChart) {
                    currentChart.clean();
                }

                try {
                    currentChart = flowchart.parse(code);
                    currentChart.drawSVG("canvas", {
                        x: 0,
                        y: 0,
                        "line-width": 2,
                        "line-length": 40,
                        "text-margin": 8,
                        "font-size": 12,
                        "font-family": "Segoe UI",
                        "font-color": "#333",
                        "line-color": "#adb5bd",
                        "element-color": "#34495e",
                        fill: "#ffffff",
                        "yes-text": "Sí",
                        "no-text": "No",
                        "arrow-end": "block",
                        scale: 1,
                        symbols: {
                            start: {
                                "font-color": "#fff",
                                "element-color": "#2ecc71",
                                fill: "#2ecc71",
                            },
                            end: {
                                "font-color": "#fff",
                                "element-color": "#e74c3c",
                                fill: "#e74c3c",
                            },
                            condition: {
                                "font-color": "#d35400",
                                "element-color": "#f39c12",
                                fill: "#fff3e0",
                            },
                            operation: { fill: "#f8f9fa" },
                        },
                    });
                } catch (error) {
                    canvas.innerHTML =
                        '<p style="color:#e74c3c; margin-top: 20px;">Error al renderizar: Revisá el código DSL.</p>';
                }
            };
        </script>
    </body>
</html>
