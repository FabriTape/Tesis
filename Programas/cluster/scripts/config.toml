# =============================================================================
# CONFIGURACIÓN CENTRALIZADA — SIMULACIONES Y ANÁLISIS LAMMPS
# =============================================================================
# Fuente única de verdad para la simulación. Leída por:
#   - enqueue_sims.py (controlador): [simulation], [sweep], [material],
#     [slurm] y [[experiment]].
#   - read_config.py → shell (config_vars.sh): SOLO el TOML mergeado por job
#     que genera el controlador (configs/config_<jobid>.toml).
# NOTA: CARBOXI usa su propio config.toml embebido, no este.
# =============================================================================

# -----------------------------------------------------------------------------
# SIMULACIÓN LAMMPS (base)
# -----------------------------------------------------------------------------
# np, cores y processors NO van acá: se resuelven por job.
#   - np: por fila de [[experiment]]
#   - cores/processors: por ff vía [sweep].grid_por_ff (lo resuelve el controlador)
[simulation]
ndumps   = 25000      # Frecuencia de dump [timesteps]
nthermo  = 5000       # Frecuencia de thermo [timesteps]
exe      = "lmp_g++_openmpi-4.0.2_stableSep2021"
timestep = 5e-11      # Paso temporal [s]

# -----------------------------------------------------------------------------
# BARRIDO Y CONTROL DE ENVÍO (base)
# -----------------------------------------------------------------------------
[sweep]
grain_radius_um = 0.76            # Radio del grano [μm] (desplazamiento move)
xrotate         = 1
yrotate         = 0
zrotate         = 0
nsteps          = [2000000]       # Pasos por (fill×vel); default si la fila no lo define
guardar_restart = false           # false = sin restart periódico (ahorra disco)
max_horas_job   = 72              # Tope de horas estimadas por job; el controlador parte en chunks
grid_por_ff      = { "0.15" = [2, 2, 1], "0.35" = [2, 4, 1] }   # ff → [px, py, pz]
est_horas_por_ff = { "0.15" = 5.5, "0.35" = 11.0 }              # ff → horas estimadas por sim

# -----------------------------------------------------------------------------
# MATERIAL (SÍLICE)
# -----------------------------------------------------------------------------
[material]
young_modulus  = 70.0e9     # Módulo de Young [Pa]
poisson        = 0.17       # Coeficiente de Poisson
surface_energy = 0.025      # Energía superficial JKR [J/m²]
density        = 2000.0     # Densidad proyectil [kg/m³]

# -----------------------------------------------------------------------------
# VALORES POR DEFECTO (CARBOXI)
# -----------------------------------------------------------------------------
[defaults]
radio_um              = 0.76   # Radio de partícula [μm]
usar_caja             = true   # Usar límites fijos de la caja vs bordes dinámicos
bed_height_ff_015     = 9.99989e-5   # Altura máxima cama para ff=0.15 [m]
bed_height_ff_035     = 9.99999e-5   # Altura máxima cama para ff=0.35 [m]
caja_x                = 1e-4   # Tamaño caja en X [m]
caja_y                = 1e-4   # Tamaño caja en Y [m]

# -----------------------------------------------------------------------------
# CRITICIDAD PARA ANÁLISIS DE ONDA AUTOMÁTICO (CARBOXI)
# -----------------------------------------------------------------------------
[analisis_onda]
v_objetivo       = -50.0       # Velocidad exacta de impacto [m/s]
tolerancia_v     = 0.1         # Margen de error para comparación de velocidad
np_criticos      = [1, 3]      # Cantidad de partículas del proyectil críticas
move_referencia  = [0.0, 0.0, 0.0]   # Vector de reposo para comparación
tolerancia_move  = 1      # Tolerancia para considerar move != 0

# -----------------------------------------------------------------------------
# UMBRALES DE FILTRADO PARA EROSIÓN (CARBOXI)
# -----------------------------------------------------------------------------
[filtros]
umbral_vz_min       = 0.0     # Velocidad vertical mínima [m/s]
umbral_energia_min  = 0.00002 # Energía cinética mínima [m²/s²]
umbral_techo_radios = 5       # Margen de seguridad en número de radios (Z)
tolerancia_v_cm     = 1e-6    # Tolerancia |Δv_cm| entre dumps [m/s]. 0 = estricto

# -----------------------------------------------------------------------------
# MODELO JKR (CARBOXI)
# -----------------------------------------------------------------------------
[jkr]
factor_cutoff = 2.05  # Factor multiplicador sobre el radio para cutoff de OVITO

# -----------------------------------------------------------------------------
# DETECCIÓN DE ONDA (CARBOXI)
# -----------------------------------------------------------------------------
[onda]
umbral_v2_min      = 0.0004  # Energía cinética mínima de partícula activa [m²/s²]
umbral_v2_max      = 0.04    # Energía cinética máxima para impacto crítico [m²/s²]
particulas_criticas = 3000   # Cantidad de partículas para onda macroscópica
umbral_techo       = 5       # Radios de tolerancia respecto a la altura de la cama
umbral_pared       = 20      # Radios de proximidad requerida a las paredes laterales

# -----------------------------------------------------------------------------
# RUTAS DE SALIDA (CARBOXI)
# -----------------------------------------------------------------------------
[rutas]
resultados = "./resultados"
imagenes   = "./resultados/Imagenes"

# -----------------------------------------------------------------------------
# SLURM (base)
# -----------------------------------------------------------------------------
[slurm]
partition = "XL"
nodelist  = "toko04"
tasks     = 8    # Sims concurrentes por job (presupuesto manual; --tasks lo sobreescribe)
nodes     = 1

# -----------------------------------------------------------------------------
# FORMULARIO DE EXPERIMENTOS — [[experiment]]
# El usuario agrega tantas filas como combinaciones desee. Cada fila se combina
# con [simulation]+[sweep]+[material]. El controlador:
#   1. agrupa por ff (resuelve grid/cores/processors desde grid_por_ff)
#   2. arma el producto cartesiano fills×vels×angles×moves×orientations
#   3. lo parte en jobs que estimen ≤ max_horas_job
#   4. omite sims ya completos (con post-run_final.data) y jobs activos
# orientaciones: lista de rotaciones del .data; "" = data base sin orientación.
#   Solo ff=0.15 tiene variantes en datas/ (90_0_1_0, 270_0_1_0, 180_1_0_0, ...).
# -----------------------------------------------------------------------------
[[experiment]]
fills        = [0.15]
vels         = [-50]
angles       = [90]
moves        = [-3, -2, -1, 0, 1, 2, 3]
orientations = ["90_0_1_0"]   # lista; "" = data base sin orientación
np           = 1
nsteps       = [2000000]      # opcional; default = [sweep].nsteps
