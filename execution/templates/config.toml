# =============================================================================
# CONFIGURACIÓN DE EJECUCIÓN — SIMULACIONES LAMMPS
# =============================================================================

# -----------------------------------------------------------------------------
# SIMULACIÓN LAMMPS
# -----------------------------------------------------------------------------
[simulation]
np = 1
ndumps = 25000
nthermo = 5000
cores = 8
processors = [4, 2, 1]
exe = "lmp_g++_openmpi-4.0.2_stableSep2021"
timestep = 5e-11

# -----------------------------------------------------------------------------
# BARRIDO DE PARÁMETROS
# -----------------------------------------------------------------------------
[sweep]
fills = [0.15, 0.35]
vels = [-50, -25, -10, -5]
angles = [0, 90]
moves = [-3, -2, -1, 0, 1, 2, 3]
total_steps = [2000000]
grain_radius_um = 0.76
xrotate = 1
yrotate = 0
zrotate = 0

# -----------------------------------------------------------------------------
# MATERIAL (SÍLICE)
# -----------------------------------------------------------------------------
[material]
young_modulus = 70.0e9
poisson = 0.17
surface_energy = 0.025
density = 2000.0

# -----------------------------------------------------------------------------
# CLUSTER SLURM
# -----------------------------------------------------------------------------
[cluster]
nodes = ["toko01", "toko02", "toko03", "toko04", "toko05", "toko06", "toko07", "toko08", "toko09"]
partition = "XL"