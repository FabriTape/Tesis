# =============================================================================
# CONFIGURACIÓN CENTRALIZADA - SIMULACIONES Y ANÁLISIS LAMMPS
# =============================================================================
# Fuente única de verdad para simulaciones de erosión granular (sílice).
# Leída por: read_config.py (→ shell), CARBOXIMINI (análisis), analyze.py
# =============================================================================

[analysis]
radio_um        = 0.76       # Radio de partícula [μm]
factor_cutoff   = 2          # Factor sobre radio para cutoff de OVITO
tolerancia_fz   = 1e-6       # Tolerancia |fz_sum| ≈ 0 [N]
resultados      = "./resultados"

[simulation]
np              = 3          # Número de partículas del proyectil
ndumps          = 25000      # Frecuencia de dump [timesteps]
nthermo         = 5000       # Frecuencia de thermo [timesteps]
cores           = 64         # Núcleos MPI
exe             = "lmp_g++_openmpi-4.0.2_stableSep2021"

[sweep]
fills           = [0.15]
vels            = [-50]
angles          = [0]
moves           = [0]
total_steps     = [200000]   # Un valor por cada combinación fill×vel×angle
grain_radius_um = 1.52       # Radio del grano [μm] (para cálculo de desplazamiento)
xrotate         = 1
yrotate         = 0
zrotate         = 0

[lammps]
timestep        = 5e-11      # Paso temporal [s]
z_filtro        = 1.046e-4   # Altura filtro aire/cama [m]
v2_min          = 1.8e-4     # Energía mínima onda [m²/s²]
v2_max          = 4e-2       # Energía máxima onda [m²/s²]
n_max           = 3000       # Partículas para onda macroscópica
umbral_xy       = 1.52e-5    # Proximidad a paredes [m]

[material]
young_modulus   = 70.0e9     # Módulo de Young [Pa]
poisson         = 0.17       # Coeficiente de Poisson
surface_energy  = 0.025      # Energía superficial JKR [J/m²]
density         = 2000.0     # Densidad proyectil [kg/m³]
