# =============================================================================
# CONFIGURACIÓN CENTRALIZADA - ANÁLISIS DE SIMULACIONES LAMMPS
# =============================================================================
# Este archivo centraliza todos los parámetros físicos, umbrales de análisis,
# y valores por defecto de la interfaz. Los valores aquí definidos se utilizan
# para garantizar la reproducibilidad y trazabilidad del análisis.
# =============================================================================

# -----------------------------------------------------------------------------
# VALORES POR DEFECTO DE LA INTERFAZ
# -----------------------------------------------------------------------------
defaults:
  radio_um: 0.76 # Radio default en micrómetros (se convierte a metros)
  hacer_onda: auto # "auto" = detectar automáticamente según criticidad
  usar_caja: true # Usar límites fijos de la caja vs dinámicos

# -----------------------------------------------------------------------------
# PARÁMETROS DE CRITICIDAD PARA ANÁLISIS DE ONDA AUTOMÁTICO
# -----------------------------------------------------------------------------
# Cuando una simulación cumple estas condiciones, el análisis de onda
# se activa AUTOMÁTICAMENTE.
analisis_onda:
  v_objetivo: -50.0 # Velocidad exacta de impacto [m/s]
  tolerancia_v: 0.1 # Margen de error para comparación de velocidad
  np_criticos: [1, 3] # Cantidad de partículas del proyectil críticas
  move_referencia: [0, 0, 0] # Vector de reposo para comparación
  tolerancia_move: 1.0e-6 # Tolerancia para considerar move != 0

# -----------------------------------------------------------------------------
# UMBRALES DE FILTRADO PARA EROSIÓN
# -----------------------------------------------------------------------------
# Parámetros que definen el criterio para detectar partículas erosionadas.
# Estos valores se cargan automáticamente al inicio del programa.
filtros:
  umbral_vz_min: 0.0 # Velocidad vertical mínima [m/s]
  umbral_energia_min: 0.0072 # Energía cinética mínima [m²/s²] (default JKR)
  umbral_techo_radios: 5 # Márgen de seguridad en número de radios (Z)

# -----------------------------------------------------------------------------
# PARÁMETROS FÍSICOS DEL MATERIAL (SÍLICE)
# -----------------------------------------------------------------------------
# Propiedades del material de las partículas para el modelo JKR.
material:
  nombre: "Silice"
  densidad: 2200.0 # [kg/m³]
  modulo_young: 7.0e10 # [Pa]
  coeficiente_poisson: 0.17
  energia_superficie: 0.032 # [J/m²] - Parámetro JKR

# -----------------------------------------------------------------------------
# PARÁMETROS DEL MODELO JKR (Johnson-Kendall-Roberts)
# -----------------------------------------------------------------------------
jkr:
  usar_modelo: true
  cutoff_coordinacion: null # Se calcula como radio * factor
  factor_cutoff: 1.5 # Factor multiplicador para cutoff de coordinación

# -----------------------------------------------------------------------------
# PARÁMETROS DE ANÁLISIS DE ONDA
# -----------------------------------------------------------------------------
onda:
  umbral_v2_min: 0.0004 # Energía cinética mínima [m²/s²]
  umbral_v2_max: 0.04 # Energía cinética máxima para impacto crítico [m²/s²]
  particulas_criticas: 3000 # Cantidad de partículas para onda macroscópica
  umbral_techo: 3 # Radios de tolerancia respecto a la altura
  umbral_pared: 20 # Radios de proximidad requerida a las paredes

# -----------------------------------------------------------------------------
# RUTAS Y DIRECTORIOS
# -----------------------------------------------------------------------------
rutas:
  resultados: "./resultados"
  imagenes: "./resultados/Imagenes"
  config: "./config.yaml"

# -----------------------------------------------------------------------------
# METADATOS DE TRAZABILIDAD
# -----------------------------------------------------------------------------
# Información que se guarda en los archivos de salida para reproducibilidad.
metadatos:
  version: "2.0.0"
  autor: "Tesis"
  incluir_en_parquet: true # Incluir metadatos como columnas en Parquet
  incluir_en_plot: true # Incluir metadatos en títulos/leyendas de plots
