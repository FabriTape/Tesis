[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carboxi"
version = "0.1.0"
description = "Análisis de simulaciones de erosión granular (LAMMPS)"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "matplotlib",
    "ovito",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["CARBOXI"]
