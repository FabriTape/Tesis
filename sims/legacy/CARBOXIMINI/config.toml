# =============================================================================
# CONFIGURACIÓN - CARBOXI_MINI
# =============================================================================
# Parámetros para análisis de clusters de partículas eyectadas en
# simulaciones LAMMPS de física granular (sílice, SI units).
# =============================================================================

[defaults]
radio_um        = 0.76       # Radio de partícula en micrómetros
factor_cutoff   = 2          # Factor multiplicador sobre radio para cutoff de OVITO
tolerancia_fz   = 1e-6       # Tolerancia para filtro |fz_sum| ≈ 0 [N]

[rutas]
resultados = "./resultados"
